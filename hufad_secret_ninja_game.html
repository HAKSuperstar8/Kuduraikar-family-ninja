<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hufad's Secret Ninja Game</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 18px; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    color: #f5f7ff; background: radial-gradient(circle at top, #263c78, #10152e 58%, #080b18);
  }
  .card {
    width: min(100%, 560px); text-align: center; padding: 26px 20px;
    border: 1px solid #7184d8; border-radius: 24px;
    background: rgba(15, 22, 51, .88); box-shadow: 0 18px 60px #0008;
  }
  h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 6vw, 2.6rem); }
  .sub { color: #c6d1ff; margin: 0 0 18px; }
  input, button {
    font: inherit; border-radius: 12px; padding: 12px 14px; border: 0;
  }
  input { width: min(100%, 280px); color: #11162d; background: #fff; }
  button { cursor: pointer; font-weight: 750; background: #72f0b4; color: #0c1930; margin: 5px; }
  button:hover { transform: translateY(-1px); filter: brightness(1.06); }
  #message { min-height: 28px; margin: 14px 0; color: #ffe68a; font-weight: 700; }
  #game { display: none; }
  .arena {
    position: relative; overflow: hidden; height: 260px; margin: 16px 0;
    border-radius: 18px; border: 2px solid #5369b9;
    background: linear-gradient(#182858 0 70%, #1e7b59 70% 100%);
  }
  .moon { position: absolute; top: 18px; right: 25px; font-size: 34px; }
  .ninja { position: absolute; left: 50%; top: 48%; transform: translate(-50%,-50%); font-size: 64px; animation: bob 1.5s ease-in-out infinite; }
  .star { position: absolute; font-size: 30px; cursor: pointer; user-select: none; animation: twinkle .8s ease-in-out infinite alternate; }
  .star:focus { outline: 2px solid white; border-radius: 8px; }
  @keyframes bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -10px; } }
  @keyframes twinkle { from { transform: scale(.8) rotate(-12deg); } to { transform: scale(1.15) rotate(12deg); } }
  #score { font-size: 1.1rem; font-weight: 800; }
  .hint { font-size: .92rem; color: #bfcaff; }
  .hidden { display:none; }
</style>
</head>
<body>
<main class="card">
  <div style="font-size:44px" aria-hidden="true">🔒🥷</div>
  <h1>Hufad's Secret Ninja Game</h1>
  <p class="sub">A secret word unlocks the ninja training arena!</p>
  <section id="lock">
    <label for="secret">Enter the secret word</label><br><br>
    <input id="secret" type="password" placeholder="Type the secret word" autocomplete="off">
    <button id="unlock">Unlock game</button>
    <div id="message" role="status">Hint: it's your chosen family name! 👀</div>
    <p class="hint">Secret word: <strong>KUDURAIKAR FAMILY</strong></p>
  </section>
  <section id="game">
    <div id="score">⭐ Stars collected: 0 / 10</div>
    <p class="hint">Tap or click the glowing stars to collect them!</p>
    <div class="arena" id="arena" aria-label="Ninja training arena">
      <div class="moon">🌙</div><div class="ninja">🥷</div>
    </div>
    <button id="again">Play again</button>
    <div id="win" role="status" class="hidden">🏆 YOU DID IT! Ninja master unlocked!</div>
  </section>
</main>
<script>
(() => {
  const input = document.querySelector('#secret');
  const lock = document.querySelector('#lock');
  const game = document.querySelector('#game');
  const message = document.querySelector('#message');
  const arena = document.querySelector('#arena');
  const scoreText = document.querySelector('#score');
  const win = document.querySelector('#win');
  let score = 0;
  document.querySelector('#unlock').addEventListener('click', () => {
    if (input.value.trim().toLowerCase() === 'kuduraikar family') {
      lock.style.display = 'none'; game.style.display = 'block'; startGame();
    } else {
      message.textContent = '❌ Not quite! Try again, young ninja.';
      input.value = '';
      input.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}], {duration:180});
    }
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') document.querySelector('#unlock').click(); });
  function startGame() {
    score = 0; scoreText.textContent = '⭐ Stars collected: 0 / 10'; win.classList.add('hidden');
    arena.querySelectorAll('.star').forEach(el => el.remove());
    for (let i = 0; i < 10; i++) {
      const star = document.createElement('button');
      star.className = 'star'; star.type = 'button'; star.textContent = '⭐';
      star.setAttribute('aria-label', 'Collect star');
      star.style.left = (5 + Math.random() * 82) + '%';
      star.style.top = (5 + Math.random() * 75) + '%';
      star.style.background = 'transparent'; star.style.padding = '2px'; star.style.border = '0';
      star.addEventListener('click', () => {
        if (star.dataset.got) return;
        star.dataset.got = '1'; star.textContent = '✨'; star.disabled = true;
        star.style.opacity = '.35'; score++;
        scoreText.textContent = `⭐ Stars collected: ${score} / 10`;
        if (score === 10) win.classList.remove('hidden');
      });
      arena.appendChild(star);
    }
  }
  document.querySelector('#again').addEventListener('click', startGame);
})();
</script>
</body>
</html>
